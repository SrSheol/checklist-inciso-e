<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1d2330; --muted: #667085; --line: #e2e5ea; --line2: #eef0f3;
    --accent: #11634f; --accent-2: #0d4f3f; --accent-soft: #e7f3ef;
    --warn: #9a5b00; --warn-bg: #fff6e5; --err: #b42318; --err-bg: #fdf0ef; --ok: #067647; --ok-bg: #eaf8f0;
    --info: #3b5bad; --info-bg: #eef2fb;
    --k-tanque: #d97706; --k-manguera: #2563eb; --k-consola: #7c3aed; --k-sistema: #0d9488; --k-otro: #64748b;
    --r: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 13px/1.4 "Google Sans Text", "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .app { padding: 10px 10px 0; min-height: 100vh; display: flex; flex-direction: column; }
  #vistaEditar { flex: 1; display: flex; flex-direction: column; }
  #vistaEditar .barra { margin-top: auto; }
  .privacy { display: flex; gap: 6px; align-items: center; margin: 0 2px 10px; color: var(--muted); font-size: 11.5px; }
  .privacy svg { flex: none; }

  /* pasos */
  .step { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 11px 11px; margin-bottom: 10px; }
  .step > h2 { display: flex; align-items: center; gap: 7px; margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
  .num { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 10.5px; letter-spacing: 0; }
  .step.done .num { background: var(--accent); }
  .step > h2 .count { margin-left: auto; text-transform: none; font-weight: 500; letter-spacing: 0; }

  /* fila destino */
  .fila-card { border-radius: 8px; background: var(--bg); padding: 8px 9px; }
  .fila-top { display: flex; align-items: baseline; gap: 6px; }
  .fila-num { font-size: 20px; font-weight: 600; line-height: 1; }
  .fila-num small { font-size: 11px; font-weight: 500; color: var(--muted); margin-right: 3px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 6px 0 0; font-size: 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
  .pill { display: flex; gap: 6px; align-items: flex-start; margin-top: 7px; padding: 5px 7px; border-radius: 6px; font-size: 11.5px; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.bad { background: var(--err-bg); color: var(--err); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.neutral { background: var(--line2); color: var(--muted); }
  .pill b { font-weight: 600; }
  .muted { color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }

  .buscar { display: flex; gap: 6px; margin-top: 8px; }
  .buscar input { flex: 1; min-width: 0; }
  input[type=text], .fld input {
    height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; outline: none; width: 100%;
  }
  input[type=text]:focus, .fld input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 500; }
  .linkbtn:hover { text-decoration: underline; }
  .linkbtn:disabled { color: var(--muted); cursor: default; text-decoration: none; }
  .acciones-fila { display: flex; justify-content: space-between; margin-top: 7px; }

  .btn { height: 30px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.big { width: 100%; height: 38px; font-size: 14px; font-weight: 600; }

  .opciones { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
  .opciones button { width: 100%; text-align: left; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; cursor: pointer; font-size: 12px; }
  .opciones button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opciones b { font-weight: 600; }

  details.existente { margin-top: 7px; font-size: 12px; }
  details.existente summary { cursor: pointer; color: var(--warn); font-weight: 500; }
  .mini { list-style: none; margin: 5px 0 0; padding: 0; max-height: 160px; overflow: auto; }
  .mini li { display: flex; gap: 6px; padding: 2px 0; border-top: 1px solid var(--line2); font-size: 11.5px; }
  .mini li:first-child { border-top: 0; }
  .mini .tag { flex: none; }

  /* PDF */
  .drop { display: flex; gap: 10px; align-items: center; border: 1.5px dashed #b9c1cc; border-radius: 9px; padding: 12px; cursor: pointer; background: #fafbfc; transition: border-color .15s, background .15s; }
  .drop:hover, .drop:focus-visible { border-color: var(--accent); outline: none; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop .ico { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .drop .t { font-size: 12.5px; }
  .drop .t b { display: block; font-weight: 600; }
  .drop.loaded { border-style: solid; border-color: var(--line); background: #fff; }
  .drop.error { border-color: var(--err); background: var(--err-bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip { padding: 2px 7px; border-radius: 999px; background: var(--line2); font-size: 11.5px; }
  .chip b { font-weight: 600; }

  /* avisos */
  details.avisos { margin-bottom: 8px; border-radius: 8px; background: var(--warn-bg); padding: 6px 8px; }
  details.avisos.solo-info { background: var(--info-bg); }
  details.avisos summary { cursor: pointer; font-weight: 600; font-size: 12px; color: var(--warn); }
  details.avisos.solo-info summary { color: var(--info); }
  details.avisos ul { margin: 6px 0 2px; padding-left: 16px; font-size: 11.5px; }
  details.avisos li { margin: 2px 0; }
  details.avisos li.info { color: var(--info); list-style: none; margin-left: -14px; }
  details.avisos li.err { color: var(--err); font-weight: 500; }

  /* bloques */
  .bloques { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .blk { min-width: 0; border-radius: 7px; background: #fff; border: 1px solid var(--line2); border-left: 3px solid var(--kc, var(--line)); }
  .blk.k-tanque { --kc: var(--k-tanque); } .blk.k-manguera { --kc: var(--k-manguera); } .blk.k-consola { --kc: var(--k-consola); }
  .blk.k-sistema { --kc: var(--k-sistema); } .blk.k-otro { --kc: var(--k-otro); }
  .blk.k-vacio { border-left-style: dashed; background: transparent; }
  .blk.open { border-color: var(--line); border-left-color: var(--kc, var(--muted)); box-shadow: 0 1px 4px rgba(16, 24, 40, .08); }
  .blk.fuera { opacity: .5; }
  .blk-head { display: flex; gap: 7px; align-items: center; width: 100%; padding: 5px 7px; background: none; border: 0; cursor: pointer; text-align: left; }
  .tag { display: inline-block; min-width: 30px; padding: 1px 0; border-radius: 4px; background: var(--line2); color: var(--ink); font-size: 10.5px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
  .blk-head .txt { flex: 1; min-width: 0; }
  .blk-head .t1 { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk-head .t2 { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk.k-vacio .t1 { color: var(--muted); font-weight: 400; font-style: italic; }
  .blk-head .id { flex: none; width: 40px; display: grid; justify-items: center; gap: 1px; }
  .blk-head .id .tag { width: 100%; }
  .blk-head .cols { color: #98a2b3; font-size: 9.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .blk-head .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
  .blk.bad .dot { background: var(--err); }
  .blk.strict .dot { box-shadow: 0 0 0 2px var(--err-bg); }
  .editor { padding: 2px 8px 8px; display: grid; gap: 6px; }
  .fld { display: grid; gap: 2px; font-size: 11px; color: var(--muted); }
  .fld em { font-style: normal; color: #98a2b3; float: right; }
  .fld input { height: 28px; color: var(--ink); font-size: 12.5px; }
  .fld input.bad { border-color: var(--err); background: var(--err-bg); }
  .fld small { color: var(--err); font-size: 11px; }
  .fld small.sug button { margin: 2px 4px 0 0; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; font-size: 11px; }
  .ed-acts { display: flex; gap: 4px; }
  .ed-acts button { flex: 1; white-space: nowrap; padding: 0 4px; height: 26px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font-size: 11.5px; color: var(--muted); }
  .ed-acts button:hover { color: var(--ink); background: var(--bg); }
  .ed-acts button.del { flex: 0 0 30px; }
  .ed-acts button.del:hover { color: var(--err); border-color: var(--err); }
  .add { margin-top: 6px; }

  /* barra de acción */
  .barra { position: sticky; bottom: 0; margin: 0 -10px; padding: 9px 10px 11px; background: rgba(245, 246, 248, .94); backdrop-filter: blur(6px); border-top: 1px solid var(--line); }
  .chk { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; margin-bottom: 8px; cursor: pointer; }
  .chk input { margin: 2px 0 0; accent-color: var(--accent); }
  .chk .muted { display: block; font-size: 11px; }
  .motivo { margin: 6px 0 0; font-size: 11.5px; color: var(--muted); text-align: center; }
  .motivo.err { color: var(--err); }

  /* diálogo */
  .velo { position: fixed; inset: 0; background: rgba(16, 24, 40, .35); display: flex; align-items: flex-end; z-index: 10; }
  .dlg { width: 100%; max-height: 92vh; overflow: auto; background: #fff; border-radius: 14px 14px 0 0; padding: 14px 12px 12px; box-shadow: 0 -8px 24px rgba(16, 24, 40, .18); animation: sube .18s ease-out; }
  @keyframes sube { from { transform: translateY(24px); opacity: 0; } }
  .dlg h3 { margin: 0 0 8px; font-size: 15px; }
  .dlg .pill { margin: 0 0 8px; }
  .cambios { list-style: none; margin: 0 0 10px; padding: 0; font-size: 11.5px; }
  .cambios li { padding: 5px 0; border-top: 1px solid var(--line2); }
  .cambios .antes { color: var(--muted); text-decoration: line-through; display: block; overflow-wrap: anywhere; }
  .cambios .nuevo { display: block; overflow-wrap: anywhere; }
  .dlg-btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }

  /* resultado */
  .resultado .cabeza { display: flex; gap: 8px; align-items: center; }
  .resultado .cabeza .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok); flex: none; }
  .resultado.fallo .cabeza .ico { background: var(--err-bg); color: var(--err); }
  .resultado h3 { margin: 0; font-size: 15px; }
  .resultado p { margin: 2px 0 0; }
  .res { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
  .res li { padding: 6px 8px; border-radius: 7px; background: var(--bg); font-size: 12px; }
  .res li .meta { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; color: var(--muted); font-size: 11px; }
  .res li.vacio { color: var(--muted); font-style: italic; }
  .error-box { margin-top: 8px; padding: 8px 9px; border-radius: 8px; background: var(--err-bg); color: var(--err); font-size: 12px; overflow-wrap: anywhere; }
  .row-btns { display: flex; gap: 6px; margin-top: 10px; }
  .row-btns .btn { flex: 1; }

  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: gira .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .skeleton { height: 46px; border-radius: 8px; background: linear-gradient(90deg, var(--line2), #f8f9fa, var(--line2)); background-size: 200% 100%; animation: brilla 1.2s infinite; }
  @keyframes brilla { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="app" id="app">
  <p class="privacy">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    El PDF se lee solo en tu navegador; no se sube a ningún lado.
  </p>

  <div id="vistaEditar">
    <section class="step" id="pasoFila">
      <h2><span class="num">1</span> Fila destino</h2>
      <div id="fila"><div class="skeleton"></div></div>
      <form class="buscar" id="formBuscar" autocomplete="off">
        <input type="text" id="q" placeholder="Folio, permiso o nº de fila" aria-label="Buscar fila por folio, permiso o número de fila">
        <button class="btn" type="submit" id="btnBuscar">Buscar</button>
      </form>
      <div class="acciones-fila">
        <button class="linkbtn" type="button" id="btnActiva">↺ Usar la celda seleccionada</button>
        <button class="linkbtn" type="button" id="btnVer" hidden>Ver en la hoja</button>

      <h2><span class="num">2</span> Checklist (PDF)</h2>
      <label class="drop" id="drop" tabindex="0">
        <input type="file" id="file" accept="application/pdf,.pdf" hidden>
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-6M9 14l3-3 3 3"/></svg></span>
        <span class="t" id="dropText"><b>Elige el PDF del checklist</b>o arrástralo aquí</span>

      <div id="resumen"></div>
    </section>

    <section class="step" id="pasoBloques" hidden>
      <h2><span class="num">3</span> Revisa los bloques <span class="count muted" id="cuenta"></span></h2>
      <div id="avisos"></div>
      <ol class="bloques" id="bloques"></ol>
      <button class="linkbtn add" type="button" id="btnAgregar">＋ Agregar bloque al final</button>
    </section>

    <div class="barra" id="barra">
      <label class="chk" id="chkLimpiar"><input type="checkbox" id="limpiar">
        <span>Limpiar bloques sobrantes a la derecha<span class="muted" id="sobrantes">Borra solo las celdas de captura hasta E100.</span></span>
      </label>
      <button class="btn primary big" type="button" id="btnLlenar" disabled>Llenar fila</button>
      <p class="motivo" id="motivo">Carga el checklist para empezar.</p>
    </div>
  </div>

  <div id="vistaResultado" hidden></div>
</div>

<div class="velo" id="velo" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>

<datalist id="dlr-producto"></datalist><datalist id="dlr-inhab"></datalist><datalist id="dlr-selC"></datalist><datalist id="dlr-sel"></datalist>
<datalist id="dlr-capE"></datalist><datalist id="dlr-capK"></datalist><datalist id="dlr-cap"></datalist>
<div id="dlHoja"></div>

<?!= incluir_('Core'); ?>

<script>
/*
 * Panel lateral «Checklist → Inciso E». Toda la lógica del checklist vive en Core.html (copia de core.js).
 * Aquí: interfaz, lectura del PDF con pdf.js y llamadas a Code.gs (google.script.run).
 * Al servidor solo se envían los valores finales de cada bloque; el PDF nunca sale del navegador.
 */
(function () {
  'use strict';

  // pdf.js se carga bajo demanda desde un CDN (con un segundo CDN de respaldo).
  const PDFJS_CDNS = ['https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/', 'https://unpkg.com/pdfjs-dist@4.10.38/build/'];
  let pdfjsPromise = null;
  function loadPdfjs() {
    pdfjsPromise = pdfjsPromise || (async () => {
      let last;
      for (const base of PDFJS_CDNS) {
        try { const m = await import(base + 'pdf.min.mjs'); m.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs'; return m; }
        catch (e) { last = e; }
      }
      throw new Error('no se pudo cargar el lector de PDF (pdf.js) desde internet (' + (last && last.message) + '). Revisa tu conexión.');
    })().catch(e => { pdfjsPromise = null; throw e; });
    return pdfjsPromise;
  }

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const FIELDS = ['select', 'producto', 'capacidad', 'inhab', 'serie'];
  const LBL = { select: 'Selección', producto: 'Producto', capacidad: 'Capacidad / manguera / nombre', inhab: 'Inhabilitado', serie: 'Serie / versión' };
  const EMPTY = () => ({ select: '', producto: '', capacidad: '', inhab: '', serie: '' });
  const normPermiso = s => Core.norm(s).replace(/\s+/g, '');

  /** Estado del panel. */
  const S = {
    ctx: null, ctxError: null, cargandoFila: true,
    blocks: [], warnings: [], parsed: null, fileName: '', open: -1, issues: [], busy: false,
  };
  let ctxListo = Promise.resolve(null);

  /** google.script.run como promesa. */
  function gs(fn, ...args) {
    return new Promise((ok, fail) => {
      if (!(window.google && google.script && google.script.run)) { fail(new Error('Este panel solo funciona dentro de Google Sheets.')); return; }
      google.script.run.withSuccessHandler(ok).withFailureHandler(e => fail(new Error((e && e.message) || String(e))))[fn](...args);
    });
  }

  // ---------- utilidades ----------
  /** [1,2,3,5] -> "E1–E3, E5" */
  function rangos(ks) {
    const out = []; let a = null, b = null;
    [...ks].sort((x, y) => x - y).forEach(k => { if (a !== null && k === b + 1) b = k; else { if (a !== null) out.push(a === b ? 'E' + a : 'E' + a + '–E' + b); a = b = k; } });
    if (a !== null) out.push(a === b ? 'E' + a : 'E' + a + '–E' + b);
    return out.join(', ');
  }
  function colsTxt(k) {
    const L = Core.blockLayout(k), cs = FIELDS.map(f => L[f]).filter(c => c != null);
    return cs.length === 1 ? Core.colLetter(cs[0]) : Core.colLetter(cs[0]) + '–' + Core.colLetter(cs[cs.length - 1]);
  }
  function kindOf(b) {
    const s = (b.select || '').toLowerCase();
    if (s.startsWith('tanque')) return 'tanque'; if (s.startsWith('dispensario')) return 'manguera';
    if (s.startsWith('consola')) return 'consola'; if (s.startsWith('sistema')) return 'sistema';
    return FIELDS.some(f => b[f]) ? 'otro' : 'vacio';
  }
  const vacio = b => !FIELDS.some(f => b[f]);
  const titulo = b => vacio(b) ? 'Vacío' : ((b.select || '').trim() || '(sin selección)');
  const subtitulo = b => [b.capacidad, b.producto, b.inhab, b.serie && 'No. ' + b.serie].filter(Boolean).join(' · ');
  const resumenBloque = b => [b.select, b.producto, b.capacidad, b.inhab, b.serie].map(v => (v || '').trim()).filter(Boolean).join(' · ') || 'vacío';
  const nUsados = () => Math.min(S.blocks.length, Core.MAX_BLOCKS);

  // ---------- listas de validación -> <datalist> ----------
  function llenarDatalist(el, list) { el.innerHTML = list.filter(v => v !== '').map(v => `<option value="${esc(v)}">`).join(''); }
  for (const [k, list] of Object.entries(Core.LISTAS_RESPALDO)) llenarDatalist($('#dlr-' + k), list);

  function aplicarListas(l) {
    const cols = {};
    if (l) for (const c in l.col) cols[c] = l.listas[l.col[c]];
    Core.usarListasDeHoja(cols, l ? l.estrictas : {});
    $('#dlHoja').innerHTML = '';
    if (l) l.listas.forEach((list, i) => { const d = document.createElement('datalist'); d.id = 'dlh' + i; llenarDatalist(d, list); $('#dlHoja').appendChild(d); });
  }
  /** id del <datalist> para el campo f del bloque k. */
  function dlFor(k, f) {
    const col = Core.blockLayout(k)[f]; if (col == null) return '';
    if (Core.usaListasDeHoja()) { const i = S.ctx.listas.col[col]; return i == null ? '' : 'dlh' + i; }
    if (f === 'producto') return 'dlr-producto'; if (f === 'inhab') return 'dlr-inhab';
    if (f === 'select') return k <= 3 ? 'dlr-selC' : 'dlr-sel';
    if (f === 'capacidad') return k === 1 ? 'dlr-capE' : k === 3 ? 'dlr-capK' : 'dlr-cap';
    return '';
  }

  // ---------- 1) fila destino ----------
  function cargarContexto(fila) {
    S.cargandoFila = true; renderFila();
    const p = gs('ckContexto', fila == null ? null : fila).then(ctx => {
      S.ctx = ctx; S.ctxError = null; S.cargandoFila = false;
      aplicarListas(ctx.listas);
      renderFila(); if (S.blocks.length) renderBloques(); actualizar();
      return ctx;
    }, e => {
      S.ctxError = e.message; S.cargandoFila = false; renderFila(); actualizar();
      throw e;
    });
    ctxListo = p.catch(() => null);
    return p;
  }

  function comparaPermiso() {
    const info = S.ctx && S.ctx.info, pdf = S.parsed && S.parsed.permiso;
    if (!info || !S.parsed) return null;
    if (!pdf) return { cls: 'warn', html: 'No se encontró el permiso en el checklist; verifica que sea la fila correcta.' };
    if (!info.permiso) return { cls: 'warn', html: `La fila no tiene permiso en la columna B. Checklist: <b>${esc(pdf)}</b>.` };
    if (normPermiso(pdf) === normPermiso(info.permiso)) return { cls: 'ok', html: '✓ Coincide con el permiso del checklist.' };
    return { cls: 'bad', mismatch: true, html: `⚠ No coincide con el checklist: <b>${esc(pdf)}</b>.` };
  }

  function renderFila() {
    const el = $('#fila');
    $('#btnVer').hidden = !(S.ctx && S.ctx.info);
    if (S.cargandoFila) { el.innerHTML = '<div class="skeleton"></div>'; return; }
    if (S.ctxError) {
      el.innerHTML = `<div class="pill bad"><span>✖ ${esc(S.ctxError)}</span></div>`;
      return;
    }
    const info = S.ctx.info;
    $('#pasoFila').classList.toggle('done', !!info);
    if (!info) { el.innerHTML = `<p class="hint">${esc(S.ctx.aviso || 'Elige la fila destino.')}</p>`; return; }
    const cmp = comparaPermiso();
    const ex = info.existentes;
    el.innerHTML = `<div class="fila-card">
        <div class="fila-top"><span class="fila-num"><small>Fila</small>${info.fila}</span></div>
        <dl class="kv"><dt>Folio Acta</dt><dd>${esc(info.folio) || '<span class="muted">(vacío)</span>'}</dd>
        <dt>Permiso</dt><dd>${esc(info.permiso) || '<span class="muted">(vacío)</span>'}</dd></dl>
        ${cmp ? `<div class="pill ${cmp.cls}"><span>${cmp.html}</span></div>` : ''}
        ${ex.length ? `<details class="existente"><summary>Ya tiene datos en ${ex.length} bloque${ex.length > 1 ? 's' : ''} (${esc(rangos(ex.map(e => e.k)))})</summary>
          <ul class="mini">${ex.map(e => `<li><span class="tag">E${e.k}</span><span>${esc(resumenBloque(e))}</span></li>`).join('')}</ul></details>`
          : '<div class="pill neutral">La fila está vacía (columnas de captura).</div>'}
      </div>`;
  }

  async function elegirFila(fila) {
    $('#busqueda').innerHTML = '';
    try { await cargarContexto(fila); gs('ckIrAFila', fila).catch(() => {}); } catch (e) { /* ya se muestra en renderFila */ }
  }

  $('#formBuscar').addEventListener('submit', async ev => {
    ev.preventDefault();
    const q = $('#q').value.trim(); if (!q) { $('#q').focus(); return; }
    const out = $('#busqueda'), btn = $('#btnBuscar');
    btn.disabled = true; out.innerHTML = '<p class="hint"><span class="spin"></span>Buscando…</p>';
    try {
      const r = await gs('ckBuscarFila', q);
      const opts = r.coincidencias.map(m => ({ fila: m.fila, html: `<b>Fila ${m.fila}</b> · ${esc(m.folio || '—')} · ${esc(m.permiso || '—')}${m.por === 'parcial' ? ' <span class="muted">(parcial)</span>' : ''}` }));
      if (r.comoFila && !opts.some(o => o.fila === r.comoFila.fila)) opts.push({ fila: r.comoFila.fila, html: `Usar la <b>fila ${r.comoFila.fila}</b> <span class="muted">(${esc(r.comoFila.folio || 'sin folio')})</span>` });
      if (r.coincidencias.length === 1 && opts.length === 1) { out.innerHTML = ''; await elegirFila(opts[0].fila); return; }
      if (!opts.length) { out.innerHTML = `<p class="hint" style="margin-top:6px">No se encontró «${esc(q)}» en las columnas A (folio) ni B (permiso).</p>`; return; }
      out.innerHTML = (r.total > r.coincidencias.length ? `<p class="hint" style="margin-top:6px">${r.total} coincidencias; se muestran las primeras ${r.coincidencias.length}.</p>` : '') +
        '<ul class="opciones">' + opts.map(o => `<li><button type="button" data-fila="${o.fila}">${o.html}</button></li>`).join('') + '</ul>';
      out.querySelectorAll('button[data-fila]').forEach(b => b.addEventListener('click', () => elegirFila(+b.dataset.fila)));
    } catch (e) {
      out.innerHTML = `<div class="pill bad"><span>✖ ${esc(e.message)}</span></div>`;
    } finally { btn.disabled = false; }
  });
  $('#btnActiva').addEventListener('click', () => { $('#busqueda').innerHTML = ''; cargarContexto(null).catch(() => {}); });
  $('#btnVer').addEventListener('click', () => { if (S.ctx && S.ctx.info) gs('ckIrAFila', S.ctx.info.fila).catch(e => alertaBarra(e.message)); });

  // ---------- 2) PDF ----------
  const drop = $('#drop'), fileEl = $('#file');
  fileEl.addEventListener('change', () => { const f = fileEl.files[0]; fileEl.value = ''; if (f) leerPdf(f); });
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileEl.click(); } });
  ['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => drop.addEventListener(n, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) leerPdf(f); });
  window.addEventListener('dragover', e => e.preventDefault()); window.addEventListener('drop', e => e.preventDefault());

  /** Fragmentos de texto con posición de cada página (mismo formato que la web app). */
  async function extractPages(data) {
    const pdfjsLib = await loadPdfjs();
    const doc = await pdfjsLib.getDocument({ data }).promise;
    const pages = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const pg = await doc.getPage(p); const vp = pg.getViewport({ scale: 1 }); const tc = await pg.getTextContent();
      pages.push({ height: vp.height, items: tc.items.filter(i => 'str' in i).map(i => ({ str: i.str, x: i.transform[4], y: i.transform[5], w: i.width, h: i.height })) });
    }
    doc.destroy();
    return pages;
  }

  function setDrop(cls, html) { drop.className = 'drop' + (cls ? ' ' + cls : ''); $('#dropText').innerHTML = html; }

  async function leerPdf(f) {
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { setDrop('error', `<b>«${esc(f.name)}» no es un PDF</b>Elige el checklist en PDF.`); return; }
    setDrop('', `<b><span class="spin"></span>Leyendo ${esc(f.name)}…</b>`);
    try {
      const data = new Uint8Array(await f.arrayBuffer());
      const [pages] = await Promise.all([extractPages(data), ctxListo]); // las listas de la hoja se usan al construir los bloques
      const lines = Core.itemsToLines(pages);
      const r = Core.processLines(lines);
      if (!lines.length) r.warnings.unshift('El PDF no contiene texto seleccionable (¿es un escaneo?). No se pudo leer nada; captura los bloques a mano.');
      Object.assign(S, { blocks: r.blocks, warnings: r.warnings, parsed: r.parsed, fileName: f.name, open: -1 });
      setDrop('loaded', `<b>${esc(f.name)}</b>Clic o arrastra otro PDF para reemplazarlo`);
      renderResumen(); renderFila(); renderBloques(); actualizar();
      $('#pasoPdf').classList.add('done'); $('#pasoBloques').hidden = false;
    } catch (e) {
      console.error(e);
      setDrop('error', `<b>No se pudo leer el PDF</b>${esc(e.message)}`);
    }
  }

  function renderResumen() {
    const p = S.parsed, mang = S.blocks.filter(b => b.kind === 'manguera');
    const nd = new Set(mang.map(b => b.select)).size, nt = p.tanques.length;
    $('#resumen').innerHTML = `<div class="chips">
        <span class="chip"><b>${nt}</b> tanque${nt === 1 ? '' : 's'}</span>
        <span class="chip"><b>${mang.length}</b> manguera${mang.length === 1 ? '' : 's'}</span>
        <span class="chip"><b>${nd}</b> dispensario${nd === 1 ? '' : 's'}</span></div>
      <dl class="kv">${p.ot ? `<dt>OT</dt><dd>${esc(p.ot)}</dd>` : ''}${p.cliente ? `<dt>Cliente</dt><dd>${esc(p.cliente)}</dd>` : ''}
        <dt>Permiso</dt><dd>${esc(p.permiso || '¿?')}</dd></dl>`;
  }

  // ---------- 3) bloques ----------
  function renderBloques() {
    const ol = $('#bloques'); ol.innerHTML = '';
    $('#cuenta').textContent = S.blocks.length + ' bloque' + (S.blocks.length === 1 ? '' : 's');
    S.blocks.forEach((b, i) => {
      const k = i + 1;
      const li = document.createElement('li');
      li.className = 'blk k-' + kindOf(b) + (i === S.open ? ' open' : '') + (k > Core.MAX_BLOCKS ? ' fuera' : '');
      li.dataset.i = i;
      const head = document.createElement('button'); head.type = 'button'; head.className = 'blk-head';
      head.setAttribute('aria-expanded', i === S.open);
      head.innerHTML = `<span class="id"><span class="tag">E${k}</span><span class="cols">${k > Core.MAX_BLOCKS ? 'no cabe' : colsTxt(k)}</span></span>` +
        `<span class="txt"><span class="t1"></span><span class="t2"></span></span><span class="dot"></span>`;
      pintarCabeza(head, b);
      head.addEventListener('click', () => { S.open = S.open === i ? -1 : i; renderBloques(); actualizar(); });
      li.appendChild(head);
      if (i === S.open) li.appendChild(editor(b, i, li));
      ol.appendChild(li);
    });
  }
  function pintarCabeza(head, b) {
    head.querySelector('.t1').textContent = titulo(b);
    head.querySelector('.t2').textContent = vacio(b) ? '' : subtitulo(b);
    head.querySelector('.t2').hidden = vacio(b);
  }

  function editor(b, i, li) {
    const k = i + 1, L = Core.blockLayout(k);
    const box = document.createElement('div'); box.className = 'editor';
    for (const f of FIELDS) {
      const col = L[f];
      if (col == null && !b[f]) continue;
      const lab = document.createElement('label'); lab.className = 'fld';
      lab.innerHTML = `<span>${LBL[f]} <em>${col ? 'col. ' + Core.colLetter(col) : 'sin columna'}</em></span>`;
      const inp = document.createElement('input'); inp.type = 'text'; inp.value = b[f] || ''; inp.dataset.f = f; inp.spellcheck = false;
      const dl = dlFor(k, f); if (dl) inp.setAttribute('list', dl);
      inp.addEventListener('input', () => {
        b[f] = inp.value;
        li.className = 'blk open k-' + kindOf(b);
        pintarCabeza(li.querySelector('.blk-head'), b);
        actualizar();
      });
      const msg = document.createElement('small'); msg.hidden = true;
      lab.appendChild(inp); lab.appendChild(msg); box.appendChild(lab);
    }
    const acts = document.createElement('div'); acts.className = 'ed-acts';
    acts.innerHTML = '<button type="button" data-a="up" title="Mover arriba">↑ Subir</button><button type="button" data-a="down" title="Mover abajo">↓ Bajar</button>' +
      '<button type="button" data-a="ins" title="Insertar un bloque vacío debajo">＋ Vacío</button><button type="button" data-a="del" class="del" title="Eliminar este bloque">✕</button>';
    acts.addEventListener('click', ev => {
      const a = ev.target.dataset.a; if (!a) return; const B = S.blocks;
      if (a === 'up' && i > 0) { [B[i - 1], B[i]] = [B[i], B[i - 1]]; S.open = i - 1; }
      if (a === 'down' && i < B.length - 1) { [B[i + 1], B[i]] = [B[i], B[i + 1]]; S.open = i + 1; }
      if (a === 'ins') { B.splice(i + 1, 0, EMPTY()); S.open = i + 1; }
      if (a === 'del') { B.splice(i, 1); S.open = -1; }
      renderBloques(); actualizar();
    });
    box.appendChild(acts);
    return box;
  }
  $('#btnAgregar').addEventListener('click', () => { S.blocks.push(EMPTY()); S.open = S.blocks.length - 1; renderBloques(); actualizar(); });

  // ---------- validación + barra ----------
  /** Bloques con datos en la hoja que cambiarían (misma regla que el servidor). */
  function afectados() {
    const info = S.ctx && S.ctx.info; if (!info) return [];
    const nTotal = $('#limpiar').checked ? Core.MAX_BLOCKS : nUsados();
    return info.existentes.filter(e => e.k <= nTotal && FIELDS.some(f => {
      const L = Core.blockLayout(e.k); if (L[f] == null) return false;
      const nuevo = e.k <= nUsados() ? (S.blocks[e.k - 1][f] || '') : '';
      return String(e[f]).trim() !== String(nuevo).replace(/[\t\r\n]+/g, ' ').trim();
    }));
  }
  const sobrantes = () => (S.ctx && S.ctx.info ? S.ctx.info.existentes.filter(e => e.k > nUsados()) : []);

  function actualizar() {
    const issues = S.issues = Core.validateBlocks(S.blocks);
    // marcas en la lista y en el editor abierto
    document.querySelectorAll('#bloques .blk').forEach(li => {
      const k = +li.dataset.i + 1, mine = issues.filter(x => x.k === k && !x.info);
      li.classList.toggle('bad', mine.length > 0); li.classList.toggle('strict', mine.some(x => x.strict));
      li.querySelectorAll('.editor input').forEach(inp => {
        const iss = mine.find(x => x.field === inp.dataset.f), msg = inp.parentNode.querySelector('small');
        inp.classList.toggle('bad', !!iss);
        msg.hidden = !iss; msg.className = '';
        if (!iss) return;
        msg.textContent = iss.strict ? 'La hoja rechaza este valor.' : (Core.blockLayout(k)[iss.field] == null ? 'Este bloque no tiene esta columna.' : 'No está en la lista de la hoja.');
        if (iss.suggestions && iss.suggestions.length) {
          msg.className = 'sug';
          iss.suggestions.forEach(s => {
            const b = document.createElement('button'); b.type = 'button'; b.textContent = s.trim() || '(espacio)'; b.title = 'Usar «' + s + '»';
            b.addEventListener('click', ev => { ev.preventDefault(); inp.value = s; inp.dispatchEvent(new Event('input')); });
            msg.appendChild(b);
          });
        }
      });
    });
    renderAvisos();
    actualizarBarra();
  }

  function renderAvisos() {
    const el = $('#avisos');
    const items = [
      ...S.issues.filter(x => !x.info).map(x => ({ cls: x.strict ? 'err' : '', t: x.msg + (x.suggestions && x.suggestions.length ? ' Sugerencias: ' + x.suggestions.map(s => s.trim()).join(' / ') + '.' : '') })),
      ...S.warnings.map(w => ({ cls: w.startsWith('ℹ') ? 'info' : '', t: w })),
      ...S.issues.filter(x => x.info).map(x => ({ cls: 'info', t: x.msg })),
    ];
    if (!S.blocks.length || !items.length) { el.innerHTML = ''; return; }
    const nWarn = items.filter(x => x.cls !== 'info').length;
    // se respeta si el usuario lo cerró, pero se abre cuando aparece una advertencia nueva
    const prev = el.querySelector('details');
    const open = prev ? (prev.open || nWarn > +prev.dataset.n) : nWarn > 0;
    el.innerHTML = `<details class="avisos${nWarn ? '' : ' solo-info'}" data-n="${nWarn}"${open ? ' open' : ''}><summary>${nWarn ? nWarn + ' advertencia' + (nWarn > 1 ? 's' : '') : 'Notas'}${nWarn && items.length > nWarn ? ' · ' + (items.length - nWarn) + ' nota' + (items.length - nWarn > 1 ? 's' : '') : ''}</summary>
      <ul>${items.map(x => `<li class="${x.cls}">${esc(x.t)}</li>`).join('')}</ul></details>`;
  }

  function actualizarBarra() {
    const btn = $('#btnLlenar'), mot = $('#motivo');
    const info = S.ctx && S.ctx.info;
    const sob = sobrantes();
    $('#sobrantes').textContent = sob.length
      ? `La fila tiene datos anteriores en ${rangos(sob.map(e => e.k))} que ${$('#limpiar').checked ? 'se borrarán' : 'quedarán si no marcas esta casilla'}.`
      : 'Borra solo las celdas de captura hasta E100.';
    $('#sobrantes').style.color = sob.length && !$('#limpiar').checked ? 'var(--warn)' : '';
    const estrictas = S.issues.filter(x => x.strict).length;
    let motivo = '', err = false;
    if (S.busy) motivo = '';
    else if (!S.blocks.length) motivo = 'Carga el checklist para empezar.';
    else if (S.ctxError) { motivo = 'No se pudo leer la hoja: ' + S.ctxError; err = true; }
    else if (S.cargandoFila) motivo = 'Leyendo la fila…';
    else if (!info) motivo = 'Elige la fila destino (paso 1).';
    else if (estrictas) { motivo = `Corrige ${estrictas} valor${estrictas > 1 ? 'es' : ''} que la hoja rechazaría (marcados en rojo).`; err = true; }
    else {
      const n = nUsados();
      motivo = `Escribirá ${n} bloque${n > 1 ? 's' : ''} (E1–E${n}) solo en columnas de captura.` + (S.blocks.length > Core.MAX_BLOCKS ? ` ${S.blocks.length - Core.MAX_BLOCKS} no caben.` : '');
    }
    btn.disabled = S.busy || !info || !S.blocks.length || !!estrictas || S.cargandoFila || !!S.ctxError;
    if (!S.busy) btn.textContent = info ? 'Llenar fila ' + info.fila : 'Llenar fila';
    mot.textContent = motivo; mot.className = 'motivo' + (err ? ' err' : '');
  }
  $('#limpiar').addEventListener('change', actualizarBarra);
  function alertaBarra(msg) { const m = $('#motivo'); m.textContent = msg; m.className = 'motivo err'; }

  function setBusy(on, label) {
    S.busy = on;
    const btn = $('#btnLlenar');
    if (on) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${esc(label)}`; }
    actualizarBarra();
  }

  // ---------- confirmación ----------
  function cerrarDialogo() { $('#velo').hidden = true; $('#dlg').innerHTML = ''; }
  $('#velo').addEventListener('click', ev => { if (ev.target.id === 'velo') cerrarDialogo(); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#velo').hidden) cerrarDialogo(); });

  function pedirConfirmacion(opts) {
    const info = S.ctx.info, cmp = comparaPermiso(), af = afectados(), sob = sobrantes();
    const necesitaPermiso = cmp && cmp.mismatch && !opts.permisoOk;
    const necesitaDatos = af.length > 0 && !opts.sobrescribir;
    if (!necesitaPermiso && !necesitaDatos) return false;
    const limpiar = $('#limpiar').checked;
    const lista = af.slice(0, 8).map(e => {
      const nuevo = e.k <= nUsados() ? resumenBloque(S.blocks[e.k - 1]) : 'vacío (se limpia)';
      return `<li><span class="tag">E${e.k}</span><span class="antes">${esc(resumenBloque(e))}</span><span class="nuevo">→ ${esc(nuevo)}</span></li>`;
    }).join('') + (af.length > 8 ? `<li class="muted">y ${af.length - 8} bloque${af.length - 8 > 1 ? 's' : ''} más…</li>` : '');
    $('#dlg').innerHTML = `<h3>¿Llenar la fila ${info.fila}?</h3>
      ${cmp && cmp.mismatch ? `<div class="pill bad"><span>⚠ El permiso del checklist (<b>${esc(S.parsed.permiso)}</b>) no coincide con el de la fila (<b>${esc(info.permiso)}</b>).</span></div>` : ''}
      ${af.length ? `<div class="pill warn"><span>Se reemplazarán datos en <b>${af.length} bloque${af.length > 1 ? 's' : ''}</b> (${esc(rangos(af.map(e => e.k)))}).</span></div><ul class="cambios">${lista}</ul>` : ''}
      ${sob.length && !limpiar ? `<div class="pill neutral"><span>Quedarán los datos anteriores de ${esc(rangos(sob.map(e => e.k)))} (no marcaste «Limpiar bloques sobrantes»).</span></div>` : ''}
      <div class="dlg-btns"><button class="btn" type="button" id="dlgNo">Cancelar</button>
      <button class="btn ${af.length ? 'danger' : 'primary'}" type="button" id="dlgSi">${af.length ? 'Sí, sobrescribir' : 'Sí, llenar'}</button></div>`;
    $('#velo').hidden = false;
    $('#dlgNo').addEventListener('click', cerrarDialogo);
    $('#dlgSi').addEventListener('click', () => { cerrarDialogo(); llenar({ permisoOk: true, sobrescribir: af.length > 0 || !!opts.sobrescribir }); });
    $('#dlgSi').focus();
    return true;
  }

  // ---------- escritura ----------
  async function llenar(opts) {
    opts = opts || {};
    const info = S.ctx && S.ctx.info; if (!info || S.busy) return;
    if (pedirConfirmacion(opts)) return;
    setBusy(true, 'Escribiendo en la hoja…');
    try {
      const r = await gs('ckLlenarFila', {
        fila: info.fila,
        bloques: S.blocks.slice(0, Core.MAX_BLOCKS).map(b => ({ select: b.select || '', producto: b.producto || '', capacidad: b.capacidad || '', inhab: b.inhab || '', serie: b.serie || '' })),
        limpiarResto: $('#limpiar').checked,
        confirmarSobrescritura: !!opts.sobrescribir,
        esperado: { folio: info.folio, permiso: info.permiso },
      });
      if (r.necesitaConfirmar) { // alguien agregó datos mientras tanto: mostrar lo que hay ahora
        S.ctx.info = r.info; renderFila(); setBusy(false);
        if (!pedirConfirmacion({ permisoOk: true })) alertaBarra('La fila cambió mientras revisabas; revisa sus datos y vuelve a intentarlo.');
        return;
      }
      mostrarResultado(r, info);
    } catch (e) {
      mostrarResultado({ ok: false, error: e.message, escritos: [] }, info);
    } finally {
      setBusy(false);
    }
  }
  $('#btnLlenar').addEventListener('click', () => llenar());

  function mostrarResultado(r, info) {
    const v = $('#vistaResultado');
    const avisos = (r.avisos || []).map(a => `<li>${esc(a)}</li>`).join('');
    if (r.ok) {
      v.innerHTML = `<section class="step resultado">
        <div class="cabeza"><span class="ico">✓</span><div><h3>Fila ${r.fila} llenada</h3>
          <p class="muted">${r.escritos.length} bloque${r.escritos.length === 1 ? '' : 's'} escrito${r.escritos.length === 1 ? '' : 's'} (${esc(rangos(r.escritos))})${r.limpiados.length ? ` · ${r.limpiados.length} limpiado${r.limpiados.length > 1 ? 's' : ''}` : ''}</p></div></div>
        ${avisos ? `<details class="avisos" open><summary>Revisa</summary><ul>${avisos}</ul></details>` : ''}
        <p class="hint" style="margin-top:10px">Descripciones generadas por la hoja (RESULTADO):</p>
        <ol class="res">${r.resultados.map(x => `<li class="${x.texto ? '' : 'vacio'}"><div class="meta"><span class="tag">E${x.k}</span>${esc(x.celda)}</div>${esc(x.texto || '(sin texto)')}</li>`).join('')}</ol>
        <div class="row-btns"><button class="btn" type="button" id="resEditar">Volver a editar</button><button class="btn primary" type="button" id="resOtro">Otro checklist</button></div>
      </section>`;
    } else {
      const escritos = r.escritos || [];
      v.innerHTML = `<section class="step resultado fallo">
        <div class="cabeza"><span class="ico">✖</span><div><h3>No se llenó la fila ${info.fila}</h3>
          <p class="muted">${escritos.length ? (r.revertido ? 'Se escribieron ' + esc(rangos(escritos)) + ' y se revirtieron.' : 'Bloques escritos: ' + esc(rangos(escritos)) + ' (no se pudieron revertir).') : 'No se escribió nada.'}</p></div></div>
        <div class="error-box">${esc(r.error)}</div>
        <div class="row-btns"><button class="btn primary" type="button" id="resEditar">Volver</button></div>
      </section>`;
    }
    $('#vistaEditar').hidden = true; v.hidden = false; window.scrollTo(0, 0);
    $('#resEditar').addEventListener('click', () => { v.hidden = true; $('#vistaEditar').hidden = false; });
    const otro = $('#resOtro');
    if (otro) otro.addEventListener('click', () => {
      Object.assign(S, { blocks: [], warnings: [], parsed: null, fileName: '', open: -1, issues: [] });
      $('#resumen').innerHTML = ''; $('#bloques').innerHTML = ''; $('#avisos').innerHTML = ''; $('#pasoBloques').hidden = true;
      $('#pasoPdf').classList.remove('done'); $('#limpiar').checked = false;
      setDrop('', '<b>Elige el PDF del checklist</b>o arrástralo aquí');
      v.hidden = true; $('#vistaEditar').hidden = false;
      cargarContexto(null).catch(() => {});
    });
    // la fila cambió: refrescar sus datos para la siguiente escritura
    if (r.ok || (r.escritos && r.escritos.length)) cargarContexto(info.fila).catch(() => {});
  }

  // ---------- inicio ----------
  cargarContexto(null).catch(() => {});
  loadPdfjs().catch(() => {}); // precarga; si falla, se reintenta al elegir el PDF
  window.__ck = { S, Core }; // depuración
})();
</script>
</body>
</html>
